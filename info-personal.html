<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me | Structural Engineer & Developer</title>
    
    <!-- CONFIGURACIÓN GLOBAL -->
    <script src="assets/js/config.js"></script>
    
    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ESTILOS -->
    <link rel="stylesheet" href="assets/css/personal.css">
    
    <!-- JS -->
    <script src="assets/js/script-personal.js" defer></script>
</head>
<body>

<div class="top-bar">
    <div class="top-bar-content">
        <div class="quick-contact" id="quick-contact"></div>
        <div>
            <span class="badge">About Me</span>
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>
            <a href="#" target="_blank" class="btn-cv-top" id="btn-cv-top"><i class="fas fa-file-pdf"></i> CV</a>
        </div>
    </div>
</div>

<div class="info-container">
    <div class="info-card">
        <div class="info-header">
            <div class="info-avatar">
                <img src="#" alt="Profile photo" id="foto-perfil">
            </div>
            <div class="info-title">
                <h2 id="info-nombre"></h2>
                <p><i class="fas fa-map-marker-alt"></i> <span id="info-ubicacion"></span></p>
            </div>
        </div>

        <div class="info-divider"></div>

        <div class="info-section">
            <h3><i class="fas fa-user-circle"></i> About Me</h3>
            <div class="info-description" id="sobre-mi"></div>
        </div>

        <div class="info-section">
            <h3><i class="fas fa-address-card"></i> Personal Information</h3>
            <div class="info-grid" id="datos-personales"></div>
        </div>

        <div class="info-section">
            <h3><i class="fas fa-graduation-cap"></i> Education</h3>
            <div class="info-grid" id="educacion"></div>
        </div>

        <div class="info-section">
            <h3><i class="fas fa-briefcase"></i> Professional Experience</h3>
            <div class="info-grid" id="experiencia"></div>
        </div>

        <div class="info-section">
            <h3><i class="fas fa-hands-helping"></i> Volunteer Work</h3>
            <div class="info-grid" id="voluntariados"></div>
        </div>

        <div class="info-section">
            <h3><i class="fas fa-code"></i> Technical Skills</h3>
            <div class="skills" id="habilidades"></div>
        </div>

        <div class="info-section">
            <h3><i class="fas fa-language"></i> Languages</h3>
            <div class="info-grid" id="idiomas"></div>
        </div>

        <div class="info-buttons">
            <a href="#" target="_blank" class="btn-download" id="btn-cv"><i class="fas fa-file-pdf"></i> VIEW CV</a>
            <a href="#" class="btn-contact" id="btn-contactar"><i class="fas fa-paper-plane"></i> CONTACT ME</a>
        </div>

        <div class="social-links">
            <p>Find me on:</p>
            <div class="social-icons" id="redes-sociales"></div>
        </div>
    </div>
</div>

<footer>
    <p class="copyright" id="copyright"></p>
</footer>

</body>
</html>
